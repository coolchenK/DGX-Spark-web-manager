[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgx-spark-web-manager"
version = "0.1.0"
description = "ARM64-native management plane for NVIDIA DGX Spark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.30,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "psutil>=6.1,<8",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


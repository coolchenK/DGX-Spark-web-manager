name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest backend/tests -q
        env:
          DGX_SECRET_KEY: ci-secret-key-with-at-least-32-characters
          DGX_ADMIN_PASSWORD: CI-password-123456
      - run: ruff check backend/app backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  container:
    runs-on: ubuntu-24.04-arm
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag dgx-spark-web-manager:ci .
